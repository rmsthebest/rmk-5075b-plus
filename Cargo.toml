[workspace]
resolver = "3"
members = ["boot-guard", "wb32-pac", "wb32-hal", "akko-5075b-plus"]

[profile.release]
# "z": the RMK image needs it to fit the 128K the linker script allows.
opt-level = "z"
lto = true
codegen-units = 1
debug = 2
panic = "abort"

[profile.dev]
opt-level = "s"
panic = "abort"

# Vendored rmk 0.9.0 with our hooks (third_party/rmk/README-akko.md).
[patch.crates-io]
rmk = { path = "third_party/rmk" }
