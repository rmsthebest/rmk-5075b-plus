[workspace]
resolver = "3"
members = ["crates/*", "firmware"]

[profile.release]
# "z": smallest code and stack frames. Speed isn't the limit: the image
# idles ~70% of the time in the sim, and opt-level 2 for the lighting
# effects changed nothing measurable (2026-10-27).
opt-level = "z"
lto = true
codegen-units = 1
debug = 2
panic = "abort"

[profile.dev]
opt-level = "s"
panic = "abort"

# Vendored rmk 0.9.0 with our hooks (third_party/rmk/README-akko.md).
[patch.crates-io]
rmk = { path = "third_party/rmk" }
