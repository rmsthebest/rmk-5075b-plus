[workspace]
resolver = "3"
members = ["crates/*", "firmware"]

[workspace.package]
edition = "2024"
rust-version = "1.85"
license = "GPL-2.0-or-later"

[profile.release]
# "z": smallest code and stack frames. Speed isn't the limit: the image
# idles ~70% of the time in the sim, and opt-level 2 for the lighting
# effects changed nothing measurable (2026-10-27).
opt-level = "z"
lto = true
codegen-units = 1
debug = 2
panic = "abort"

[profile.dev]
opt-level = "s"
panic = "abort"

# rmk main with our hooks: submodule of github.com/rmsthebest/rmk, branch
# akko-main (third_party/rmk/rmk/README-akko.md).
[patch.crates-io]
rmk = { path = "third_party/rmk/rmk" }
