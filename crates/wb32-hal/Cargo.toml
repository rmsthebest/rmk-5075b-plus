[package]
name = "wb32-hal"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
readme = "README.md"
keywords = ["wb32", "wb32fq95", "embedded", "no-std", "embassy"]
categories = ["embedded", "hardware-support", "no-std"]
description = "Embassy drivers for the WestberryTech WB32FQ95: GPIO, EXTI, clocks, time driver, UART3, QSPI, SPI NOR, WS2812, USB, stop mode"

[dependencies]
wb32-pac = { path = "../wb32-pac", features = ["rt"] }
cortex-m = { version = "0.7.7", features = ["critical-section-single-core"] }
cortex-m-rt = "0.7.5"
critical-section = "1.2.0"
embassy-time-driver = { version = "0.2.2", features = ["tick-hz-1_000_000"] }
embassy-time-queue-utils = "0.3.2"
embassy-sync = "0.8.0"
embassy-futures = "0.1.2"
embedded-hal = "1.0.0"
embedded-hal-async = "1.0.0"
embassy-time = "0.5.1"
embassy-usb-driver = "0.2.0"
embedded-storage = "0.3.1"
embedded-storage-async = "0.4.1"
# musb 0.3.1 plus the PRs offered upstream (fixes and the WB32 profile):
# submodule of github.com/rmsthebest/musb, branch akko-next.
musb = { path = "../../third_party/musb", default-features = false, features = ["prebuild", "builtin-wb32fq95", "embassy-usb-driver-impl"] }

[package.metadata.docs.rs]
default-target = "thumbv7m-none-eabi"
targets = ["thumbv7m-none-eabi"]
