[package]
name = "akko-boot-guard"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
readme = "README.md"
publish = false
description = "Akko 5075B Plus: reset-time escape into the WB32 ROM DFU bootloader (RAM magic or Esc held), crash record and crash-loop policy"

[features]
# Bring-up only: enter the ROM bootloader on every boot.
always-dfu = []
# Provide a #[panic_handler] that resets into DFU.
panic-dfu = []
