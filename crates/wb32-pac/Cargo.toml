[package]
name = "wb32-pac"
version = "0.1.0"
edition = "2024"
description = "WB32FQ95 register access, generated by tools/gen_pac.py"

[dependencies]
cortex-m = "0.7.7"
cortex-m-rt = { version = "0.7.5", optional = true }

[features]
# Interrupt vector table and device.x for cortex-m-rt.
rt = ["dep:cortex-m-rt", "cortex-m-rt/device"]
