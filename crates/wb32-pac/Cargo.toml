[package]
name = "wb32-pac"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
readme = "README.md"
keywords = ["wb32", "wb32fq95", "embedded", "no-std", "pac"]
categories = ["embedded", "hardware-support", "no-std"]
description = "Register access for the WestberryTech WB32FQ95 (chiptool style), generated from the vendor CMSIS header"

[dependencies]
cortex-m = "0.7.7"
cortex-m-rt = { version = "0.7.5", optional = true }

[features]
# Interrupt vector table and device.x for cortex-m-rt.
rt = ["dep:cortex-m-rt", "cortex-m-rt/device"]

[package.metadata.docs.rs]
default-target = "thumbv7m-none-eabi"
targets = ["thumbv7m-none-eabi"]
