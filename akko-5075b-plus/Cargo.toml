[package]
name = "akko-5075b-plus"
version = "0.1.0"
edition = "2024"

[dependencies]
cortex-m = "0.7.7"
cortex-m-rt = "0.7.5"
boot-guard = { path = "../boot-guard", features = ["panic-dfu"] }
wb32-hal = { path = "../wb32-hal" }
wb32-pac = { path = "../wb32-pac", features = ["rt"] }
embassy-executor = { version = "0.10.0", features = ["platform-cortex-m", "executor-thread"] }
embassy-time = "0.5.1"
embassy-futures = "0.1.2"
embassy-sync = "0.8.0"
embassy-usb = { version = "0.6.0", default-features = false }
heapless = "0.9"
embedded-hal = "1.0.0"
embedded-hal-async = "1.0.0"
rmk = { version = "0.9.0", default-features = false, features = ["storage", "vial"] }

[build-dependencies]
serde_json = "1"
lzma-rs = "0.3"

[features]
always-dfu = ["boot-guard/always-dfu"]

[[bin]]
name = "m1a-bounce"
test = false
bench = false

[[bin]]
name = "m1b-stub"
test = false
bench = false

[[bin]]
name = "m2-blink"
test = false
bench = false

[[bin]]
name = "m3-usb"
test = false
bench = false

[[bin]]
name = "akko-rmk"
path = "src/main.rs"
test = false
bench = false
