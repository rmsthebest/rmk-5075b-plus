[package]
name = "firmware"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "RMK firmware for the Akko 5075B Plus (WB32FQ95): the akko-rmk image and the bring-up images"
publish = false

[dependencies]
cortex-m = "0.7.7"
cortex-m-rt = "0.7.5"
critical-section = "1.2.0"
akko-boot-guard = { path = "../crates/akko-boot-guard", features = ["panic-dfu"] }
wb32-hal = { path = "../crates/wb32-hal" }
akko-lighting = { path = "../crates/akko-lighting" }
qmk-wireless = { path = "../crates/qmk-wireless" }
wb32-pac = { path = "../crates/wb32-pac", features = ["rt"] }
embassy-executor = { version = "0.10.0", features = ["platform-cortex-m", "executor-thread"] }
embassy-time = "0.5.1"
embassy-futures = "0.1.2"
embassy-sync = "0.8.0"
embassy-usb = { version = "0.6.0", default-features = false }
heapless = "0.9"
embedded-hal = "1.0.0"
embedded-hal-async = "1.0.0"
embedded-storage-async = "0.4.1"
embedded-io-async = "0.7"
rmk = { version = "0.9.0", default-features = false, features = ["storage", "vial"] }

[build-dependencies]
serde_json = "1"
lzma-rs = "0.3"

[features]
always-dfu = ["akko-boot-guard/always-dfu"]
# Vial channel 0xDA reads the ROM bootloader and the information blocks out
# (src/main.rs `peek`, rom/tools/rompeek.py). Read-only; only for studying
# the ROM (rom/README.md).
rom-peek = []

[[bin]]
name = "m1a-bounce"
test = false
bench = false

[[bin]]
name = "m1b-stub"
test = false
bench = false

[[bin]]
name = "m2-blink"
test = false
bench = false

[[bin]]
name = "m3-usb"
test = false
bench = false

[[bin]]
name = "akko-rmk"
path = "src/main.rs"
test = false
bench = false
