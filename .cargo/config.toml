[build]
target = "thumbv7m-none-eabi"

[target.thumbv7m-none-eabi]
linker = "flip-link"
rustflags = [
    "-C", "link-arg=-Tlink.x",
    # Library crates' panic locations without the "crates/" prefix: the
    # message has to fit boot-guard's 120-byte record.
    "--remap-path-prefix=crates/=",
]

[env]
KEYBOARD_TOML_PATH = { value = "firmware/rmk.toml", relative = true }
# RMK's storage keeps the keymap (Vial edits) while its schema hash matches
# what it was saved with. The hash covers rmk's version, features, macro/
# combo/morse sizes and RMK_COMMIT, which rmk otherwise takes from git, so
# every commit on our fork would reset the keymap (third_party/rmk/rmk/
# README-akko.md). Bump this only when a fork change alters what's stored;
# that resets the keymap to src/keymap.rs. A changed src/keymap.rs doesn't:
# stored keys (each by layer, row and column) win over the compiled ones
# until EE_CLR or StorageConfig's clear_layout. akko-main-1: the move to rmk
# main (one keymap reset, 2026-10-28).
RMK_COMMIT = "akko-main-1"
