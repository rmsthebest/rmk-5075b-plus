[build]
target = "thumbv7m-none-eabi"

[target.thumbv7m-none-eabi]
linker = "flip-link"
rustflags = [
    "-C", "link-arg=-Tlink.x",
    # Panic locations name their source file; without the registry prefix
    # those strings are ~2.7 KB shorter. (Only matches this machine's cargo
    # home; elsewhere it does nothing.)
    "--remap-path-prefix=/home/tony/.cargo/registry/src/index.crates.io-1949cf8c6b5b557f/=",
]

[env]
KEYBOARD_TOML_PATH = { value = "akko-5075b-plus/rmk.toml", relative = true }
# RMK's storage keeps the keymap (Vial edits) while this matches what it
# was saved with (third_party/rmk/README-akko.md). Change it only when the
# stored layout changes (rows, columns, layers, encoders): that resets the
# keymap to src/keymap.rs. 0x6025ede8 was image ec155e856040's (on the
# board 2026-10-27); 0x6025ede9 came with 16 storage sectors and the smaller
# behaviour slots in rmk.toml (one keymap reset, agreed with the user).
RMK_BUILD_HASH = "0x6025ede9"
